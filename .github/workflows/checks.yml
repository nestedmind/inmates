name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check agent definitions
        run: scripts/check-agents.sh
      - name: Check version bump
        env:
          NO_BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'no-bump') && '1' || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version-bump.sh "origin/$BASE_REF"
